<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500원 모아 건물주</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- QRCode.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            appBg: '#EAF3FE',
            tabActive: '#255183',
            
            // 밥 카테고리 (시원한 시안/블루 톤)
            rice: {
              title: '#255183',
              pill: '#9EE0E8',
              pillHover: '#86D7E0',
              text: '#124855'
            },
            
            // 빵 카테고리 (따뜻한 웜 샌드/베이지 톤)
            bread: {
              title: '#8A5828',
              pill: '#FEE3B8',
              pillHover: '#FDD89F',
              text: '#5B3813'
            }
          }
        }
      }
    }
  </script>

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background-color: #EAF3FE;
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col items-center justify-start p-4 sm:p-6 select-none">

  <header class="w-full max-w-sm flex items-center justify-between my-5 sm:my-7 px-1 relative">
    <!-- Title -->
    <div class="flex items-center gap-2 mx-auto">
      <h1 class="text-2xl font-black text-[#255183] tracking-tight">
        500원 모아 건물주
      </h1>
    </div>

    <!-- Top Right QR Button -->
    <button onclick="openQrModal()" class="absolute right-0 top-0.5 w-10 h-10 bg-white/90 backdrop-blur rounded-2xl shadow-sm border border-blue-100 flex items-center justify-center text-[#255183] hover:bg-blue-50 active:scale-95 transition-all" title="QR 코드">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path>
      </svg>
    </button>
  </header>

  <nav class="w-full max-w-sm mb-6 flex gap-2 p-2 bg-white/80 backdrop-blur rounded-2xl border border-blue-100 shadow-sm">
    <button onclick="switchTab('rice')" id="tab-rice" class="tab-btn flex-1 py-3 rounded-xl text-base font-extrabold transition-all bg-tabActive text-white shadow-sm">
      밥
    </button>
    <button onclick="switchTab('bread')" id="tab-bread" class="tab-btn flex-1 py-3 rounded-xl text-base font-extrabold text-slate-400 hover:text-slate-700 transition-all">
      빵
    </button>
  </nav>

  <main class="w-full max-w-sm bg-white rounded-[32px] p-7 sm:p-8 shadow-sm border border-blue-100/80 mb-8">
    
    <!-- Section 1: 밥 -->
    <section id="sec-rice" class="sec-group">
      <div id="grid-rice" class="grid grid-cols-2 gap-x-3.5 gap-y-5 sm:gap-y-6">
        <!-- Pill Buttons Injected via JS -->
      </div>
    </section>

    <!-- Section 2: 빵 -->
    <section id="sec-bread" class="sec-group hidden">
      <div id="grid-bread" class="grid grid-cols-2 gap-x-3.5 gap-y-5 sm:gap-y-6">
        <!-- Pill Buttons Injected via JS -->
      </div>
    </section>

  </main>

  <div id="qrModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white p-6 rounded-[28px] shadow-lg max-w-xs w-full flex flex-col items-center border border-slate-100">
      <h3 class="text-base font-bold text-slate-800 mb-4">페이지 QR 코드</h3>
      
      <div class="p-4 bg-white rounded-2xl border border-slate-100 shadow-inner flex items-center justify-center mb-5">
        <div id="qrcode"></div>
      </div>

      <button onclick="closeQrModal()" class="w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm rounded-2xl transition-colors">
        닫기
      </button>
    </div>
  </div>

  <script>
    // Web App Link Items Data (밥 / 빵) - 각 버튼별 개별 파스텔 색상 적용
    const APP_DATA = {
      rice: [
        { name: "출결관리", url: "https://stringweek-cyber.github.io/student/", bg: "bg-[#9EE0E8]", hover: "hover:bg-[#86D7E0]", text: "text-[#124855]" },
        { name: "담임전달사항", url: "https://stringweek-cyber.github.io/message", bg: "bg-[#B5E2FA]", hover: "hover:bg-[#9ED4F7]", text: "text-[#1A4B6E]" },
        { name: "진도표", url: "https://stringweek-cyber.github.io/lesson/", bg: "bg-[#A8E6CF]", hover: "hover:bg-[#91DFC2]", text: "text-[#134E3A]" },
        { name: "덧셈만 하는 계산기", url: "https://stringweek-cyber.github.io/plus", bg: "bg-[#C3CEF7]", hover: "hover:bg-[#B0C0F3]", text: "text-[#213263]" }
      ],
      bread: [
        { name: "결정적소비", url: "https://stringweek-cyber.github.io/budget", bg: "bg-[#FFC0CB]", hover: "hover:bg-[#FFB2C0]", text: "text-[#6E1A24]" },
        { name: "주기관리", url: "https://stringweek-cyber.github.io/time", bg: "bg-[#FFB3B3]", hover: "hover:bg-[#FF9999]", text: "text-[#701C1C]" },
        { name: "하루루틴", url: "https://stringweek-cyber.github.io/routine", bg: "bg-[#FFCBDD]", hover: "hover:bg-[#FFA3C3]", text: "text-[#6B1B38]" },
        { name: "오늘의 계획", url: "https://stringweek-cyber.github.io/todolist", bg: "bg-[#FFD3B6]", hover: "hover:bg-[#FFC4A1]", text: "text-[#683318]" },
        { name: "학습계획", url: "https://stringweek-cyber.github.io/plan", bg: "bg-[#F8AFA6]", hover: "hover:bg-[#F69C91]", text: "text-[#5C1D18]" },
        { name: "질병관리", url: "https://stringweek-cyber.github.io/illness", bg: "bg-[#FFC2C7]", hover: "hover:bg-[#FFB0B6]", text: "text-[#691C22]" },
        { name: "좋은거 싫은거", url: "https://stringweek-cyber.github.io/like", bg: "bg-[#FFAAA6]", hover: "hover:bg-[#FF9793]", text: "text-[#631B1A]" },
        { name: "맛집평가", url: "https://stringweek-cyber.github.io/food", bg: "bg-[#FCD5CE]", hover: "hover:bg-[#FBBFA8]", text: "text-[#61241C]" },
        { name: "성적관리", url: "https://stringweek-cyber.github.io/grades/", bg: "bg-[#F8C8DC]", hover: "hover:bg-[#F3B3CD]", text: "text-[#611F3C]" },
        { name: "학과탐색", url: "https://stringweek-cyber.github.io/career", bg: "bg-[#FFE5EC]", hover: "hover:bg-[#FFD0DC]", text: "text-[#722038]" }
      ]
    };

    // Render Pill Buttons
    function renderAppButtons() {
      const catConfig = {
        rice: { container: 'grid-rice' },
        bread: { container: 'grid-bread' }
      };

      Object.keys(APP_DATA).forEach(cat => {
        const config = catConfig[cat];
        const container = document.getElementById(config.container);
        
        container.innerHTML = APP_DATA[cat].map(item => `
          <a href="${item.url}" target="_blank" 
             class="${item.bg} ${item.hover} ${item.text} font-bold text-sm sm:text-base min-h-[58px] py-3.5 px-3 rounded-2xl flex items-center justify-center text-center transition-all active:scale-95 shadow-sm leading-snug break-keep">
            ${item.name}
          </a>
        `).join('');
      });
    }

    // Tab Switching Logic (밥 / 빵)
    function switchTab(selectedTab) {
      const tabs = ['rice', 'bread'];
      
      tabs.forEach(tab => {
        const btn = document.getElementById(`tab-${tab}`);
        const sec = document.getElementById(`sec-${tab}`);

        if (tab === selectedTab) {
          btn.className = "tab-btn flex-1 py-2.5 rounded-xl text-base font-extrabold transition-all bg-tabActive text-white shadow-sm";
          sec.classList.remove('hidden');
        } else {
          btn.className = "tab-btn flex-1 py-2.5 rounded-xl text-base font-extrabold text-slate-400 hover:text-slate-700 transition-all";
          sec.classList.add('hidden');
        }
      });
    }

    // QR Code Modal Logic
    let qrInstance = null;
    function openQrModal() {
      const modal = document.getElementById('qrModal');
      const container = document.getElementById('qrcode');
      
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      if (!qrInstance) {
        container.innerHTML = '';
        qrInstance = new QRCode(container, {
          text: window.location.href,
          width: 150,
          height: 150,
          colorDark: "#255183",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
      }
    }

    function closeQrModal() {
      const modal = document.getElementById('qrModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // Initialize on Load
    window.onload = function() {
      renderAppButtons();
    };
  </script>
</body>
</html>
