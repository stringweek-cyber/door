<body class="min-h-screen text-slate-800 flex flex-col items-center justify-start p-4 sm:p-6 select-none relative">

    <div class="flex items-center gap-0.5 shrink-0 ml-auto">
      <button onclick="openQrModal('https://stringweek-cyber.github.io/door/', '전체 페이지')"

          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path>

  <script>
    const APP_DATA = {
      rice: [
        { name: "출결관리", url: "https://stringweek-cyber.github.io/student/", bg: "bg-[#9EE0E8]", hover: "hover:bg-[#86D7E0]", text: "text-[#124855]" },
        { name: "담임전달사항", url: "https://stringweek-cyber.github.io/message", bg: "bg-[#B5E2FA]", hover: "hover:bg-[#9ED4F7]", text: "text-[#1A4B6E]" },
        { name: "진도표", url: "https://stringweek-cyber.github.io/lesson/", bg: "bg-[#A8E6CF]", hover: "hover:bg-[#91DFC2]", text: "text-[#134E3A]" },
        { name: "덧셈계산기", url: "https://stringweek-cyber.github.io/plus", bg: "bg-[#C3CEF7]", hover: "hover:bg-[#B0C0F3]", text: "text-[#213263]" }
      ],
      bread: [
        { name: "결정적소비", url: "https://stringweek-cyber.github.io/budget", bg: "bg-[#FFC0CB]", hover: "hover:bg-[#FFB2C0]", text: "text-[#6E1A24]" },
        { name: "주기관리", url: "https://stringweek-cyber.github.io/time", bg: "bg-[#FFB3B3]", hover: "hover:bg-[#FF9999]", text: "text-[#701C1C]" },
        { name: "하루루틴", url: "https://stringweek-cyber.github.io/routine", bg: "bg-[#FFCBDD]", hover: "hover:bg-[#FFA3C3]", text: "text-[#6B1B38]" },
        { name: "오늘의 계획", url: "https://stringweek-cyber.github.io/todolist", bg: "bg-[#FFD3B6]", hover: "hover:bg-[#FFC4A1]", text: "text-[#683318]" },
        { name: "학습계획", url: "https://stringweek-cyber.github.io/plan", bg: "bg-[#F8AFA6]", hover: "hover:bg-[#F69C91]", text: "text-[#5C1D18]" },
        { name: "질병관리", url: "https://stringweek-cyber.github.io/illness", bg: "bg-[#FFC2C7]", hover: "hover:bg-[#FFB0B6]", text: "text-[#691C22]" },
        { name: "좋은거 싫은거", url: "https://stringweek-cyber.github.io/like", bg: "bg-[#FFAAA6]", hover: "hover:bg-[#FF9793]", text: "text-[#631B1A]" },

        const container = document.getElementById(config.container);
        
        container.innerHTML = APP_DATA[cat].map(item => `

                      class="w-8 h-8 rounded-xl bg-white/40 hover:bg-white/80 active:scale-95 flex items-center justify-center transition-all" 
                      title="${item.name} QR 코드">
                <svg class="w-4 h-4 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path>
                </svg>
              </button>
              
              <button onclick="copyLink('${item.url}', '${item.name}')" 
                      class="w-8 h-8 rounded-xl bg-white/40 hover:bg-white/80 active:scale-95 flex items-center justify-center transition-all" 
                      title="${item.name} 링크 복사">
                <svg class="w-4 h-4 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path>
                </svg>
              </button>
            </div>
          </div>
        `).join('');
      });
    }

    function switchTab(selectedTab) {
      currentTab = selectedTab;
      const tabs = ['rice', 'bread'];
      
      tabs.forEach(tab => {
        const btn = document.getElementById(`tab-${tab}`);
        const sec = document.getElementById(`sec-${tab}`);

        if (tab === selectedTab) {
          btn.className = "tab-btn flex-1 py-3 rounded-xl text-lg font-extrabold transition-all bg-tabActive text-white shadow-sm";
          sec.classList.remove('hidden');
        } else {
          btn.className = "tab-btn flex-1 py-3 rounded-xl text-lg font-extrabold text-slate-400 hover:text-slate-700 transition-all";
          sec.classList.add('hidden');
        }
      });
    }

    // 화면 좌/우 터치 스와이프 제스처 감지
    let touchStartX = 0;
    let touchStartY = 0;

    document.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].screenX;
      const touchEndY = e.changedTouches[0].screenY;

      const deltaX = touchEndX - touchStartX;
      const deltaY = touchEndY - touchStartY;

      if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 50) {
        if (deltaX < 0 && currentTab === 'rice') {
          switchTab('bread');
        } else if (deltaX > 0 && currentTab === 'bread') {
          switchTab('rice');
        }
      }
    }, { passive: true });

    // QRCode.js를 사용해 브라우저 내에서 즉시 QR 코드 생성 (네트워크 요청 없음)
    function openQrModal(url = TARGET_DOOR_URL, title = '페이지') {
      const modal = document.getElementById('qrModal');
      const container = document.getElementById('qrcode');
      const titleEl = document.getElementById('qrModalTitle');
      
      if (titleEl) {
        titleEl.textContent = `${title} QR 코드`;
      }

      modal.classList.remove('hidden');
      modal.classList.add('flex');

      container.innerHTML = '';
      new QRCode(container, {
        text: url,
        width: 150,
        height: 150
      });
    }

    function closeQrModal() {
      const modal = document.getElementById('qrModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function copyLink(url = TARGET_DOOR_URL, title = '') {
      const tempInput = document.createElement('input');
      tempInput.value = url;
      document.body.appendChild(tempInput);
      tempInput.select();
      document.execCommand('copy');
      document.body.removeChild(tempInput);
    }

    window.onload = function() {
      renderAppButtons();
    };
  </script>
</body>
</html>
